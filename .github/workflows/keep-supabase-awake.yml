# Pings the database once a day so the free Supabase project never pauses.
# Uses the public (anon) key that is already in index.html. Read-only.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read public tallies
        env:
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxseXRhZ3dldHV0bXB4dHpqbHFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNTU3MzAsImV4cCI6MjEwODYzMTczMH0.1OKGxi8DUBTGyNjftZu18NopGXQGGJM0yNeYEyz2E6k
        run: |
          curl -sf -X POST "https://llytagwetutmpxtzjlqg.supabase.co/rest/v1/rpc/get_tallies_v2" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "{}" -o /dev/null
          echo "Supabase is awake"
